            document.getElementById('login-admin-btn').addEventListener('click', async function() {
                if (this.disabled) return;
                this.disabled = true;
                this.textContent = '驗證中...';
                const name = document.getElementById('login-admin-name').value.trim();
                const pass = document.getElementById('login-admin-pass').value.trim();
                const errEl = document.getElementById('login-admin-error');
                if (!name || !pass) { errEl.textContent = '請填寫名稱及密碼';
                    this.disabled = false;
                    this.textContent = '確認'; return; }
                try {
                    // 檢查 Firebase 的 admins 節點
                    const snap = await db.ref('admins/' + name).once('value');
                    const data = snap.val();
                    let valid = false;
                    if (data && data.passwordHash) {
                        const hash = await sha256(pass);
                        if (hash === data.passwordHash) valid = true;
                    } else {
                        // 若 Firebase 無記錄，則使用硬編碼（方便測試）
                        if (name === 'fai' && pass === 'Fai64986786') valid = true;
                    }

                        state.phone = name;

            });

                try {

                    state.isAdmin = false;
                    await db.ref('users/' + state.uid).set({ phone, role: 'user', lastLogin: Date.now() });
